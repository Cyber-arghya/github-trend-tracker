name: Automated Scraper & AI Analyzer

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Scraper and AI Analyzer (Decoupled Supabase Storage)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STORAGE_MODE: supabase
        run: |
          python git-trend.py
          python summarize.py
          
      - name: Commit & Push Local Fallbacks (if any)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No local data changes to commit (Supabase decoupled storage active)."
            exit 0
          fi
          git commit -m "Auto-update: Scraped Data & DevOps Analysis [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin main
